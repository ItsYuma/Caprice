[package]
name = "caprice-desktop"
version = "0.1.0"
description = "Caprice desktop shell"
edition = "2021"

[lib]
name = "caprice_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
cpal = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
telmo = { version = "0.3.3", default-features = false }
transcribe-rs = { version = "0.3.12", default-features = false, features = [
  "onnx",
] }
# transcribe-rs 0.3.12 calls the ort rc.12 session builder. Later rc releases changed that signature.
ort = "=2.0.0-rc.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
