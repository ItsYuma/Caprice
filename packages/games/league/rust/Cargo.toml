[package]
name = "caprice-league"
version = "0.1.0"
description = "Caprice League client"
edition = "2021"

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
