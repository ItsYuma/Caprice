[package]
name = "caprice-desktop"
version = "0.1.0"
description = "Caprice desktop shell"
edition = "2021"

[lib]
name = "caprice_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
